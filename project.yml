name: LiveOrderTracker
options:
  bundleIdPrefix: com.jjh717
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LiveOrderTracker:
    type: application
    platform: iOS
    sources:
      - path: LiveOrderTracker
      - path: Shared
    dependencies:
      - target: LiveOrderTrackerWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjh717.LiveOrderTracker
        INFOPLIST_FILE: LiveOrderTracker/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LiveOrderTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveOrderTrackerWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjh717.LiveOrderTracker.Widget
        INFOPLIST_FILE: LiveOrderTrackerWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
